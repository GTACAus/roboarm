<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, minimum-scale=1, user-scalable=no, viewport-fit=cover">
  <title>Robot Arm Remote</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="panel" id="panel">
    <div id="modes">
      <button id="mRemote" class="sel">Remote</button>
      <button id="mMuscle">Muscle sensor</button>
    </div>

    <div class="hdr">
      <button id="edit" aria-label="Change the remote">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M4 20h4L19 9l-4-4L4 16z"/>
          <path d="M13.5 6.5l4 4"/>
        </svg>
      </button>
    </div>

    <div id="board"></div>

    <div id="musclebox">
      <div class="big" id="pct">0%</div>
      <canvas id="graph"></canvas>
      <div>Muscle signal over the last 30 seconds. The muscle sensor is moving the arm.</div>
    </div>

    <div id="editbar">
      <button data-add="dpad">+ D-pad</button>
      <button data-add="slider">+ Slider</button>
      <button data-add="joy">+ Joystick</button>
      <button data-add="button">+ Button</button>
      <button class="warn" id="reset">Start again</button>
    </div>

    <div id="status">Hold the controls to move the arm</div>
  </div>

  <div id="dlg">
    <div id="dlgbox"></div>
  </div>

  <script src="script.js"></script>
</body>
</html>
