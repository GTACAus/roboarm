<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <title>Robot Arm</title>
  <style>
    * {
      touch-action: manipulation;
    }
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #0a0a0a;
      font-family: system-ui, -apple-system, Arial, sans-serif;
      color: #bbb;
      text-align: center;
    }
    .box {
      background: #121212;
      border: 10px solid #2b2b2b;
      border-radius: 28px;
      padding: 32px 24px;
      width: min(92vw, 520px);
    }
    h1 {
      color: #e8fffc;
      font-size: 1.5em;
      margin: 0 0 18px;
    }
    a {
      display: block;
      background: #0ba89a;
      color: #06211e;
      font-weight: 700;
      font-size: 1.3em;
      text-decoration: none;
      border-radius: 999px;
      padding: 18px;
      margin: 10px 0 18px;
    }
    p {
      line-height: 1.45;
      margin: 8px 0;
    }
  </style>
</head>
<body>
  <div class="box">
    <h1>Robot arm</h1>
    <a href="http://1.1.1.1/">Open the remote</a>
    <p>You can also open <b>Safari</b> and go to <b>1.1.1.1</b> for the full-screen remote.</p>
    <p>If a <b>Done</b> button appears at the top, tap <b>Done</b> to stay on this Wi-Fi. Do not tap Cancel.</p>
  </div>
</body>
</html>
